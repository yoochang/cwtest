<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안부 문자</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #2f7d5b; --accent-text: #fff; --border: #e3e1dc; --due: #c2552d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #222; --text: #f2f2f2; --muted: #a0a0a5;
      --accent: #4cae83; --accent-text: #0b1f16; --border: #333; --due: #ef8a62;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 14px; margin-bottom: 12px; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 17px; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border);
         border-radius: 999px; padding: 0 8px; }
  .last { margin-left: auto; font-size: 13px; color: var(--muted); }
  .last.due { color: var(--due); font-weight: 600; }
  textarea { width: 100%; min-height: 96px; margin: 10px 0 4px; padding: 10px; font: inherit;
             color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; resize: vertical; }
  .meta { font-size: 12px; color: var(--muted); min-height: 18px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button, a.send { flex: 1; text-align: center; padding: 11px 8px; border-radius: 10px; font: inherit;
                   font-size: 15px; border: 1px solid var(--border); background: var(--card); color: var(--text);
                   text-decoration: none; cursor: pointer; }
  a.send { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; flex: 1.4; }
  button:disabled { opacity: .5; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>안부 문자</h1>
  <p class="sub">초안을 다듬고 <b>메시지 앱 열기</b>를 누르면 받는 사람과 내용이 채워진 채로 열려요. 보내기는 직접 눌러 주세요.</p>
  <div id="list"><p class="empty">불러오는 중…</p></div>
</main>
<script>
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function smsLink(phone, body) {
  const num = phone.replace(/[^\d+]/g, "");
  return `sms:${num}${isIOS ? "&" : "?"}body=${encodeURIComponent(body)}`;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  } : undefined);
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.json();
}

function lastLabel(c) {
  if (c.days_since === null) return "아직 기록 없음";
  if (c.days_since === 0) return "오늘 연락함";
  return `${c.days_since}일 전 연락`;
}

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderCard(c) {
  const card = el("section", {className: "card"});
  const head = el("div", {className: "head"});
  head.append(
    el("span", {className: "name"}, c.name),
    el("span", {className: "tag"}, `${c.relation_label} · ${c.polite ? "존댓말" : "반말"}`),
    el("span", {className: "last" + (c.due ? " due" : "")}, lastLabel(c) + (c.due ? " · 연락할 때" : "")),
  );
  const text = el("textarea", {"aria-label": `${c.name}에게 보낼 문자`});
  const meta = el("div", {className: "meta"});
  const send = el("a", {className: "send", href: "#"}, "메시지 앱 열기");
  const regen = el("button", {type: "button"}, "다시 만들기");
  const row = el("div", {className: "row"});
  row.append(regen, send);
  card.append(head, text, meta, row);

  const sync = () => { send.href = smsLink(c.phone, text.value); };
  text.addEventListener("input", sync);

  async function load() {
    regen.disabled = true;
    meta.textContent = "문자 만드는 중…";
    try {
      const d = await api("/api/draft", {id: c.id, previous: text.value || null});
      text.value = d.text;
      meta.textContent = d.source === "ai" ? "Claude가 작성한 초안" :
        "템플릿 초안" + (d.warning ? ` (${d.warning})` : "");
      sync();
    } catch (e) {
      meta.textContent = "초안 생성 실패: " + e.message;
    } finally {
      regen.disabled = false;
    }
  }
  regen.addEventListener("click", load);

  // 메시지 앱이 열리면 오늘 연락한 것으로 기록
  send.addEventListener("click", async () => {
    try {
      const updated = await api("/api/sent", {id: c.id});
      const last = head.querySelector(".last");
      last.className = "last";
      last.textContent = lastLabel(updated);
    } catch (_) { /* 기록 실패해도 문자 보내기는 막지 않음 */ }
  });

  load();
  return card;
}

(async () => {
  const list = document.getElementById("list");
  try {
    const contacts = await api("/api/contacts");
    list.replaceChildren(...(contacts.length ? contacts.map(renderCard)
      : [el("p", {className: "empty"}, "contacts.json에 연락처를 추가해 주세요.")]));
  } catch (e) {
    list.replaceChildren(el("p", {className: "empty"}, "연락처를 불러오지 못했어요: " + e.message));
  }
})();
</script>
</body>
</html>
